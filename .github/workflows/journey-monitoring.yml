# Reusable workflow: plan / apply / drift-check an app's journey-monitoring
# root module (the one that calls modules/slo, modules/probe, modules/sentry-alert).
#
#   mode: plan   on pull_request. Plans and posts the plan as a sticky PR comment.
#   mode: apply  on push to main. Applies. Refuses to run from any other ref.
#                Uploads the state from before and after the apply as run
#                artifacts (90 days); they contain secrets.
#   mode: drift  nightly. Plans with no changes expected; a diff opens (or
#                updates) a GitHub issue labelled monitoring-drift.
#
# Keys: call with `secrets: inherit`. Repo-level secrets hold READ-ONLY keys
# (a Datadog app key scoped to read monitors and SLOs, a Cloudflare token with
# Workers Scripts: Read, a read-only Sentry token). The apply job runs in the
# `apply-environment` GitHub environment, whose same-named secrets hold the
# only write-capable keys and override the repo-level ones there. Restrict
# that environment to the main branch. docs/journey-monitoring.md has the
# caller workflow and the key setup.

name: journey-monitoring

on:
  workflow_call:
    inputs:
      mode:
        description: plan | apply | drift
        type: string
        required: true
      working-directory:
        description: Directory of the root module, e.g. monitoring
        type: string
        required: true
      tofu-version:
        type: string
        default: "1.12.3"
      apply-environment:
        description: GitHub environment holding the write-capable keys
        type: string
        default: monitoring-apply

permissions:
  contents: read

jobs:
  plan:
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_probe_datadog_api_key: ${{ secrets.PROBE_DATADOG_API_KEY }}
      TF_VAR_probe_request_headers: ${{ secrets.PROBE_REQUEST_HEADERS || '{}' }}
      PLATFORM_INFRA_READ_TOKEN: ${{ secrets.PLATFORM_INFRA_READ_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Module sources in this private org (github.com/stabilestack/platform-infra//modules/...)
      # are git fetches; the job's GITHUB_TOKEN can't read another private repo.
      - name: git credentials for private module sources
        if: env.PLATFORM_INFRA_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${PLATFORM_INFRA_READ_TOKEN}@github.com/stabilestack/".insteadOf "https://github.com/stabilestack/"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - run: tofu fmt -check -recursive
      - run: tofu init
      - run: tofu validate

      - name: plan
        id: plan
        run: |
          set +e
          tofu plan -no-color -lock=false -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          if [ "$code" = "1" ]; then
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            cp plan.log plan.txt
          else
            echo "outcome=$([ "$code" = "2" ] && echo changes || echo none)" >> "$GITHUB_OUTPUT"
            tofu show -no-color tfplan > plan.txt
          fi
          echo "summary=$(grep -E '^(Plan:|No changes\.)' plan.log | tail -1)" >> "$GITHUB_OUTPUT"
          [ "$code" != "1" ]

      - name: comment
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          WORKDIR: ${{ inputs.working-directory }}
          OUTCOME: ${{ steps.plan.outputs.outcome }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const dir = process.env.WORKDIR;
            const marker = `<!-- journey-monitoring-plan:${dir} -->`;
            const file = path.join(dir, "plan.txt");
            let plan = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "(no plan output)";
            const limit = 60000;
            if (plan.length > limit) plan = plan.slice(0, limit) + "\n… truncated; see the job log for the full plan.";
            const head = process.env.OUTCOME === "error"
              ? "❌ **Plan failed.**"
              : `**${process.env.SUMMARY || "Plan complete."}**`;
            const body = [
              marker,
              `### Journey monitoring plan: \`${dir}\``,
              head,
              "Applies from `main` after merge. Every resource has `prevent_destroy`; a destroy here fails apply until a human PR removes the guard.",
              "<details><summary>Plan</summary>\n\n```\n" + plan + "\n```\n</details>",
            ].join("\n\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  apply:
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.apply-environment }}
    concurrency:
      group: journey-monitoring-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_probe_datadog_api_key: ${{ secrets.PROBE_DATADOG_API_KEY }}
      TF_VAR_probe_request_headers: ${{ secrets.PROBE_REQUEST_HEADERS || '{}' }}
      PLATFORM_INFRA_READ_TOKEN: ${{ secrets.PLATFORM_INFRA_READ_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: refuse anything but main
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          echo "::error::apply runs from main only (ref ${GITHUB_REF}, event ${GITHUB_EVENT_NAME})"
          exit 1

      - uses: actions/checkout@v4

      # Module sources in this private org (github.com/stabilestack/platform-infra//modules/...)
      # are git fetches; the job's GITHUB_TOKEN can't read another private repo.
      - name: git credentials for private module sources
        if: env.PLATFORM_INFRA_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${PLATFORM_INFRA_READ_TOKEN}@github.com/stabilestack/".insteadOf "https://github.com/stabilestack/"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - run: tofu init

      # State snapshots. R2 (and any unversioned bucket) can't roll back a bad
      # state write, so keep the state from either side of every apply as a
      # run artifact. State holds the probe runner's secrets: these steps run
      # only on the main-branch apply, never on pull_request, and the files
      # stay outside the checkout. Restore recipe: docs/journey-monitoring.md.
      - name: snapshot state (pre-apply)
        id: pre
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/tofu-state"
          mkdir -p "$dir"
          # First apply: no state yet, so the pull succeeds with empty output
          # and the pre snapshot is an empty file. A failed pull stops the
          # apply: never write state we couldn't snapshot first.
          tofu state pull > "$dir/pre.tfstate"
          slug=$(printf '%s' "$WORKDIR" | tr -c 'A-Za-z0-9._-' '-')
          echo "name=tofu-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${slug}" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: upload state (pre-apply)
        if: steps.pre.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pre.outputs.name }}-pre
          path: ${{ steps.pre.outputs.dir }}/pre.tfstate
          retention-days: 90
          if-no-files-found: error

      - name: apply
        id: apply
        run: tofu apply -auto-approve

      # Runs after a failed apply too: a partial apply can still write state.
      - name: snapshot state (post-apply)
        id: post
        if: always() && steps.pre.outcome == 'success' && steps.apply.outcome != 'skipped'
        env:
          SNAPSHOT_DIR: ${{ steps.pre.outputs.dir }}
        run: |
          umask 077
          tofu state pull > "$SNAPSHOT_DIR/post.tfstate"

      - name: upload state (post-apply)
        if: always() && steps.post.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pre.outputs.name }}-post
          path: ${{ steps.pre.outputs.dir }}/post.tfstate
          retention-days: 90
          if-no-files-found: error

  drift:
    if: inputs.mode == 'drift'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_probe_datadog_api_key: ${{ secrets.PROBE_DATADOG_API_KEY }}
      TF_VAR_probe_request_headers: ${{ secrets.PROBE_REQUEST_HEADERS || '{}' }}
      PLATFORM_INFRA_READ_TOKEN: ${{ secrets.PLATFORM_INFRA_READ_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Module sources in this private org (github.com/stabilestack/platform-infra//modules/...)
      # are git fetches; the job's GITHUB_TOKEN can't read another private repo.
      - name: git credentials for private module sources
        if: env.PLATFORM_INFRA_READ_TOKEN != ''
        run: git config --global url."https://x-access-token:${PLATFORM_INFRA_READ_TOKEN}@github.com/stabilestack/".insteadOf "https://github.com/stabilestack/"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - run: tofu init

      - name: plan (no changes expected)
        id: plan
        run: |
          set +e
          tofu plan -no-color -lock=false -detailed-exitcode > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != "1" ]

      - name: open or update the drift issue
        if: steps.plan.outputs.code == '2'
        uses: actions/github-script@v7
        env:
          WORKDIR: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const dir = process.env.WORKDIR;
            const title = `Monitoring drift: ${dir}`;
            let plan = fs.readFileSync(path.join(dir, "plan.log"), "utf8");
            if (plan.length > 60000) plan = plan.slice(0, 60000) + "\n… truncated";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly plan for \`${dir}\` found changes. Someone edited monitoring outside Terraform, or a merged change never applied.`,
              "Fix it in code, or adopt the live change into the contracts/config; never apply over it blind.",
              `Run: ${run}`,
              "<details><summary>Plan</summary>\n\n```\n" + plan + "\n```\n</details>",
            ].join("\n\n");
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: "monitoring-drift" });
            const existing = open.find((i) => i.title === title);
            if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title, body, labels: ["monitoring-drift"] });
            core.setFailed("drift detected");
